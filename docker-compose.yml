services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gogig
      POSTGRES_PASSWORD: gogig
      POSTGRES_DB: gogig
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gogig"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://gogig:gogig@db:5432/gogig
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /storage
    volumes:
      - ./storage:/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://gogig:gogig@db:5432/gogig
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /storage
    volumes:
      - ./storage:/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
